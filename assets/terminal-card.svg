<svg width="850" height="115" viewBox="0 0 850 115" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0d1525"/>
    </linearGradient>
    <linearGradient id="borderG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36BCF5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#36BCF5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#36BCF5" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background panel -->
  <rect x="25" y="10" width="800" height="95" rx="6" fill="url(#bgG)" stroke="#36BCF5" stroke-width="0.5" stroke-opacity="0.15"/>
  
  <!-- Top border glow -->
  <rect x="25" y="10" width="800" height="1" fill="url(#borderG)"/>

  <!-- Terminal prompt lines -->
  <g font-family="'Courier New', monospace" font-size="13">
    <text x="50" y="40" fill="#36BCF5" opacity="0.5">$</text>
    <text x="65" y="40" fill="#8892a4" opacity="0.7">whoami</text>
    <text x="50" y="60" fill="#e2e8f0" opacity="0.9">→ Sartome</text>
    <text x="350" y="60" fill="#36BCF5" opacity="0.4">|</text>
    <text x="365" y="60" fill="#8892a4" opacity="0.6">Étudiant BTS SIO SLAM</text>

    <text x="50" y="85" fill="#36BCF5" opacity="0.5">$</text>
    <text x="65" y="85" fill="#8892a4" opacity="0.7">cat focus.txt</text>
    <text x="195" y="85" fill="#e2e8f0" opacity="0.9">→ PHP • Docker • MVC • SQL • Sécurité</text>
  </g>

  <!-- Blinking cursor -->
  <rect x="520" y="75" width="8" height="14" fill="#36BCF5" opacity="0.8">
    <animate attributeName="opacity" values="0;0.8;0" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Status light -->
  <circle cx="790" cy="25" r="3" fill="#36BCF5" filter="url(#gl)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
