<svg width="850" height="230" viewBox="0 0 850 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1525"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36BCF5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#36BCF5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#36BCF5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#36BCF5" stop-opacity="0"/>
      <stop offset="50%" stop-color="#36BCF5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#36BCF5" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="230" fill="url(#bgGrad)" rx="0"/>

  <!-- Grid pattern -->
  <g opacity="0.04" stroke="#36BCF5" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="230"/><line x1="50" y1="0" x2="50" y2="230"/>
    <line x1="100" y1="0" x2="100" y2="230"/><line x1="150" y1="0" x2="150" y2="230"/>
    <line x1="200" y1="0" x2="200" y2="230"/><line x1="250" y1="0" x2="250" y2="230"/>
    <line x1="300" y1="0" x2="300" y2="230"/><line x1="350" y1="0" x2="350" y2="230"/>
    <line x1="400" y1="0" x2="400" y2="230"/><line x1="450" y1="0" x2="450" y2="230"/>
    <line x1="500" y1="0" x2="500" y2="230"/><line x1="550" y1="0" x2="550" y2="230"/>
    <line x1="600" y1="0" x2="600" y2="230"/><line x1="650" y1="0" x2="650" y2="230"/>
    <line x1="700" y1="0" x2="700" y2="230"/><line x1="750" y1="0" x2="750" y2="230"/>
    <line x1="800" y1="0" x2="800" y2="230"/><line x1="850" y1="0" x2="850" y2="230"/>
    <line x1="0" y1="0" x2="850" y2="0"/><line x1="0" y1="50" x2="850" y2="50"/>
    <line x1="0" y1="100" x2="850" y2="100"/><line x1="0" y1="150" x2="850" y2="150"/>
    <line x1="0" y1="200" x2="850" y2="200"/>
  </g>

  <!-- Scanning line animation -->
  <rect x="0" y="0" width="850" height="40" fill="url(#scanGrad)">
    <animateTransform attributeName="transform" type="translate" values="0,-40;0,230" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets - top left -->
  <g stroke="#36BCF5" stroke-width="1.5" fill="none" opacity="0.6">
    <polyline points="20,45 20,20 45,20"/>
    <polyline points="805,20 830,20 830,45"/>
    <polyline points="830,185 830,210 805,210"/>
    <polyline points="45,210 20,210 20,185"/>
  </g>

  <!-- Animated corner dots -->
  <circle cx="20" cy="20" r="2" fill="#36BCF5" filter="url(#glowSoft)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="20" r="2" fill="#36BCF5" filter="url(#glowSoft)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="210" r="2" fill="#36BCF5" filter="url(#glowSoft)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="210" r="2" fill="#36BCF5" filter="url(#glowSoft)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Status indicator top-left -->
  <circle cx="45" cy="40" r="3" fill="#36BCF5" filter="url(#glowSoft)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="55" y="44" fill="#36BCF5" font-family="monospace" font-size="10" opacity="0.6">SYS_ONLINE</text>

  <!-- Status indicator top-right -->
  <text x="720" y="44" fill="#36BCF5" font-family="monospace" font-size="10" opacity="0.5" text-anchor="end">v2.0.26</text>
  <rect x="725" y="36" width="30" height="10" rx="2" fill="none" stroke="#36BCF5" stroke-width="0.8" opacity="0.4"/>
  <rect x="727" y="38" width="20" height="6" rx="1" fill="#36BCF5" opacity="0.3">
    <animate attributeName="width" values="5;20;5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Main title -->
  <text x="425" y="105" text-anchor="middle" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="42" font-weight="bold" letter-spacing="6" filter="url(#glow)">SARTOME</text>

  <!-- Subtitle line -->
  <line x1="280" y1="120" x2="570" y2="120" stroke="url(#accentGrad)" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="425" y="145" text-anchor="middle" fill="#36BCF5" font-family="'Courier New', monospace" font-size="13" letter-spacing="3" opacity="0.9">BACK-END DEVELOPER</text>

  <!-- Description -->
  <text x="425" y="170" text-anchor="middle" fill="#8892a4" font-family="'Courier New', monospace" font-size="11" letter-spacing="1">PHP • DOCKER • SQL • ARCHITECTURE MVC</text>

  <!-- Bottom bar -->
  <rect x="50" y="195" width="750" height="1" fill="url(#accentGrad)" opacity="0.3"/>

  <!-- Bottom status text -->
  <text x="55" y="215" fill="#8892a4" font-family="monospace" font-size="9" opacity="0.4">ÉTUDIANT BTS SIO SLAM</text>
  <text x="795" y="215" fill="#8892a4" font-family="monospace" font-size="9" opacity="0.4" text-anchor="end">FRANCE // 2026</text>

  <!-- Floating particles -->
  <circle cx="120" cy="80" r="1" fill="#36BCF5" opacity="0.4">
    <animate attributeName="cy" values="80;60;80" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="730" cy="100" r="1" fill="#36BCF5" opacity="0.3">
    <animate attributeName="cy" values="100;75;100" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="160" r="0.8" fill="#36BCF5" opacity="0.3">
    <animate attributeName="cy" values="160;140;160" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="70" r="0.8" fill="#36BCF5" opacity="0.3">
    <animate attributeName="cy" values="70;55;70" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="50" r="0.6" fill="#FFFFFF" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="190" r="0.6" fill="#FFFFFF" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
